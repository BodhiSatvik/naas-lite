apiVersion: apps/v1
kind: Deployment
metadata:
  name: naas-lite
  labels:
    app: naas-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: naas-lite
  template:
    metadata:
      labels:
        app: naas-lite
    spec:
      containers:
        - name: naas-lite
          image: naas-lite:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
